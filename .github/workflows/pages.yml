name: Deploy GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'latest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp latest.json _site/
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Conker's Bad Fur Day Decompilation Progress</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; max-width: 800px; margin: 0 auto; }
              h1 { color: #58a6ff; }
              pre { background: #161b22; padding: 1rem; border-radius: 6px; overflow: auto; }
              a { color: #58a6ff; text-decoration: none; }
            </style>
          </head>
          <body>
            <h1>Conker's Bad Fur Day Decompilation Progress</h1>
            <p>Raw JSON: <a href="latest.json">latest.json</a></p>
            <p>Repository: <a href="https://github.com/itsjuztin/conker">github.com/itsjuztin/conker</a></p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
